<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>Dashboard - FastFood</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />

    <!-- FontAwesome -->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <!-- Bootstrap icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap) -->
    <link href="css/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Bootstrap core JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS -->
    <script src="js/scripts.js"></script>

    <!-- Layout and Auth -->
    <script src="/utils/layout.js"></script>
    <script type="module" src="/utils/auth.js"></script>
    <link href="/utils/layout.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="pt-5">

    <div data-include="navbar"></div>

    <!-- Header -->
    <header class="bg-success py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <h1 class="display-4 fw-bolder" id="restaurant-name">Your Restaurant</h1>
                <!-- <p class="lead fw-normal text-white-50 mb-0">With this shop homepage template</p> -->
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <ul class="nav nav-pills justify-content-center mt-4" id="nav-tabs">
        <li class="nav-item">
            <a class="nav-link" aria-current="page" href="/dashboard">Orders</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="/stats">Stats</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/restSettings">Settings</a>
        </li>
    </ul>

    <!-- Alert Block -->
    <div class="alert alert-danger d-flex align-items-center d-none" id="alert-block" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span id="alert-msg"></span>
    </div>

    <!-- Stats Section -->
    <section class="py-5 bg-light">
        <div class="container mt-5 ">
            <div class="row g-4  overflow-auto justify-content-center">
                <!-- Orders Completion Progress Card -->
                <div class="col-9 mb-5">
                    <div class="card mb-3 h-100">
                        <div class="card-body">
                            <div class="card-title h5 mb-4">
                                <i class="bi bi-graph-up-arrow me-2"></i>Orders Completion
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span id="completed-orders-label">Completed Orders: <span
                                        id="completed-orders">0</span></span>
                                <span id="total-orders-label">Total Orders: <span id="total-orders">0</span></span>
                            </div>
                            <div class="progress" style="height: 2rem;">
                                <div class="progress-bar bg-success" id="orders-progress-bar" role="progressbar"
                                    style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                                    0%
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row g-4  overflow-auto justify-content-center">
                <!-- Total Revenue -->
                <div class="col-12 col-md-3">
                    <div class="card text-white bg-primary mb-3 h-100 flex-row align-items-center">
                        <div class="card-body">
                            <div class="card-title h6">
                                <i class="bi bi-currency-euro me-2"></i>Total Revenue
                            </div>
                            <p class="card-text display-6" id="total-revenue">€0</p>
                        </div>
                    </div>
                </div>
                <!-- Average Order Value -->
                <div class="col-12 col-md-3">
                    <div class="card text-white bg-success mb-3 h-100 flex-row align-items-center">
                        <div class="card-body">
                            <div class="card-title h6">
                                <i class="bi bi-currency-euro me-2"></i>Average Order Value
                            </div>
                            <p class="card-text display-6" id="average-order-value">€0</p>
                        </div>
                    </div>
                </div>
                <!-- Monthly Revenue -->
                <div class="col-12 col-md-3">
                    <div class="card text-white bg-warning mb-3 h-100 flex-row align-items-center">
                        <div class="card-body">
                            <div class="card-title h6">
                                <i class="bi bi-currency-euro me-2"></i>Monthly Revenue
                            </div>
                            <p class="card-text display-6" id="monthly-revenue">€0</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row g-4 mt-5 overflow-auto justify-content-center">

                <!-- Most Popular Item -->
                <div class="col-12 col-md-3">
                    <div class="card text-white bg-danger mb-3 h-100 flex-row align-items-center">
                        <div class="card-body">
                            <div class="card-title h6">
                                <i class="bi bi-basket-fill me-2"></i>Most popular Item
                            </div>
                            <p class="card-text display-6" id="most-popular-item">N/A</p>
                        </div>
                    </div>
                </div>
                <!-- Customer Count -->
                <div class="col-12 col-md-3">
                    <div class="card text-white bg-info mb-3 h-100 flex-row align-items-center">
                        <div class="card-body">
                            <div class="card-title h6">
                                <i class="bi bi-basket-fill me-2"></i>Customer count
                            </div>
                            <p class="card-text display-6" id="customer-count">0</p>
                        </div>
                    </div>
                </div>
                <!-- Average Items per Order -->
                <div class="col-12 col-md-3">
                    <div class="card text-white bg-secondary mb-3 h-100 flex-row align-items-center">
                        <div class="card-body">
                            <div class="card-title h6">
                                <i class="bi bi-basket-fill me-2"></i>Average items per order
                            </div>
                            <p class="card-text display-6" id="average-items-per-order">0</p>
                        </div>
                    </div>
                </div>
                <!-- Monthly Revenue Chart -->
                <div class="col-12 col-md-9">
                    <div class="card mb-4">
                        <div class="card-body">
                            <h5 class="card-title">Entrate Mensili</h5>
                            <canvas id="monthly-revenue-chart" height="120"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </section>

    <div data-include="loginCard"></div>
    <div data-include="footer"></div>

</body>

</html>
