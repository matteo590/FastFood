<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>Dashboard - FastFood</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />

    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>



    <script src="/utils/layout.js"></script>
    <script type="module" src="/utils/auth.js"></script>
    <link href="/utils/layout.css" rel="stylesheet" />

</head>

<body class="pt-5">

    <div data-include="navbar"></div>

    <!-- Header-->
    <header class="bg-success py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <h1 class="display-4 fw-bolder" id="restaurant-name">Your Restaurant</h1>
                <!--<p class="lead fw-normal text-white-50 mb-0">With this shop hompeage template</p> -->
            </div>
        </div>
    </header>

    <ul class="nav nav-pills justify-content-center mt-4" id="nav-tabs">
        <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/dashboard">Orders</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/stats">Stats</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/restSettings">Settings</a>
        </li>
    </ul>

    <!-- Section-->
    <section class="py-5 bg-light">
        <div class="container mt-5">
            <div id="card_body">
                <!-- Example Order Section Start -->
                <div class="card mb-5 d-none" id="card">
                    <div class="card-header bg-white">
                        <div class="mb-3">
                            <span class="fw-bold title">Ordine #12345</span>
                            <span class="text-muted float-end date">Data: 2024-06-10</span>
                        </div>
                        <!-- Progress Bar with 4 Steps -->
                        <h5 class="mb-3">Stato ordine</h5>

                        <!-- Barra di avanzamento -->
                        <div class="progress" style="height: 10px;" aria-labelledby="order-progress-label">
                            <div class="progress-bar bg-success" role="progressbar" style="width: 0%;" aria-valuemin="0"
                                aria-valuemax="100" aria-valuenow="0"></div>
                        </div>
                        <!-- Etichette step -->
                        <div class="d-flex justify-content-between mt-2 labels">
                            <span class="badge rounded-pill bg-secondary-subtle text-secondary border"
                                data-step="ordered">ordered</span>
                            <span class="badge rounded-pill bg-secondary-subtle text-secondary border"
                                data-step="in_progress">preparing</span>
                            <span class="badge rounded-pill bg-secondary-subtle text-secondary border"
                                data-step="on_deliver">on the way</span>
                            <span class="badge rounded-pill bg-secondary-subtle text-secondary border"
                                data-step="delivered">delivered</span>
                        </div>
                        <div class="mt-3 d-flex gap-2">
                            <button class="btn btn-outline-primary btn-sm in_progress_btn">preparing</button>
                            <button class="btn btn-outline-primary btn-sm on_the_way_btn">on the way</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <!-- Order Details Table -->
                        <div class="table-responsive">
                            <table class="table table-striped align-middle text-center">
                                <thead class="table-dark">
                                    <tr>
                                        <th scope="col">Immagine</th>
                                        <th scope="col">Nome</th>
                                        <th scope="col">Quantità</th>
                                        <th scope="col">Prezzo</th>
                                    </tr>
                                </thead>
                                <tbody id="order-table-body">
                                    <!-- Righe generate da JS -->
                                </tbody>
                            </table>
                        </div>
                        <!-- Order Total -->
                        <div class="text-end mt-3">
                            <span class="fw-bold fs-5 totale">Totale: €15.50</span>
                        </div>
                    </div>
                </div>
                <!-- Example Order Section End -->

                <!-- Puoi duplicare la sezione sopra per altri ordini -->
            </div>
        </div>

    </section>

    <div data-include="loginCard"></div>
    <div data-include="footer"></div>

</body>

</html>
