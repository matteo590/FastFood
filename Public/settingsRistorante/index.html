<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>Settings - FastFood</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />


    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>



    <script src="/utils/layout.js"></script>
    <script type="module" src="/utils/auth.js"></script>
    <link href="/utils/layout.css" rel="stylesheet" />

</head>

<body class="pt-5">

    <div data-include="navbar"></div>

    <!-- Header-->
    <header class="bg-success py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <h1 class="display-4 fw-bolder" id="restaurant-name">Your Restaurant</h1>
                <!--<p class="lead fw-normal text-white-50 mb-0">With this shop hompeage template</p> -->
            </div>
        </div>
    </header>

    <ul class="nav nav-pills justify-content-center mt-4" id="nav-tabs">
        <li class="nav-item">
            <a class="nav-link" aria-current="page" href="/dashboard">Orders</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/stats">Stats</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="/restSettings">Settings</a>
        </li>
    </ul>
    <!-- Section-->
    <section class="py-5 d-flex flex-column gap-5">
        <div class="container d-flex flex-column justify-content-center">
            <div class="d-flex flex-row justify-content-between">
                <h2 class="my-3">Restaurant info</h2>
                <div>
                    <button class="btn btn-danger" id="delete-btn">Delete Restaurant</button>
                </div>
            </div>
            <form>
                <div class="row mb-4">
                    <div class="col">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-tag"></i></span>
                            <input type="text" id="name" placeholder="Restaurant name" class="form-control">
                        </div>
                    </div>
                    <div class="col">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-tag"></i></span>
                            <input type="text" id="category" placeholder="Restaurant category" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-geo-alt-fill"></i></span>
                            <input type="text" id="address" placeholder="Address" class="form-control">
                        </div>
                    </div>
                    <div class="col">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-bank"></i></span>
                            <input type="text" id="piva" placeholder="p.iva" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-building"></i></span>
                            <input type="text" id="logo" placeholder="Logo link" class="form-control">
                        </div>
                    </div>
                    <div class="col">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                            <input type="text" id="tel" placeholder="Phone number" class="form-control">
                        </div>
                    </div>

                </div>
                <div class="row">

                    <div class="alert alert-danger d-flex align-items-center d-none" id="alert-block" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span id="alert-msg"></span>
                    </div>

                    <button class="btn btn-primary">Save</button>
                </div>
            </form>
            <hr>
            <h2 class="my-3" id="main-title">Choose your menu</h2>




            <main class="container px-4 px-lg-5 my-4">
                

                <!-- Barra azioni -->
                <div class="d-flex flex-column flex-md-row gap-2 justify-content-between align-items-md-center mb-3">
                    <!-- 🔎 Search -->
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input id="meal-search" type="search" class="form-control"
                            placeholder="Cerca per nome o categoria…">
                    </div>

                    <button id="add-meal-btn" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>Aggiungi piatto
                    </button>
                </div>

                <!-- Griglia cards -->
                <div class="row g-4" id="meals-grid">
                    <!-- Template card -->
                    <div class="col-12 col-sm-6 col-lg-4 d-none" id="meal-card-template">
                        <div class="card h-100 shadow-sm">
                            <div class="position-relative">
                                <img class="card-img-top meal-img" src="" alt="">
                                <span class="badge position-absolute top-0 end-0 m-2 visibility-badge"></span>
                            </div>
                            <div class="card-body">
                                <h5 class="card-title meal-name"></h5>
                                <p class="card-text mb-1"><i class="meal-category"></i></p>
                                <p class="card-text fw-bold meal-price"></p>

                                <!-- toggle visibilità: mostrato solo se è nel menu -->
                                <div class="form-check form-switch mt-2 vis-toggle-wrap">
                                    <input class="form-check-input meal-visible-toggle" type="checkbox">
                                    <label class="form-check-label">Mostra nel menu</label>
                                </div>
                            </div>

                            <div class="card-footer bg-transparent border-top d-flex gap-2">
                                <button class="btn btn-outline-primary flex-grow-1 btn-edit">Modifica</button>
                                <button class="btn btn-outline-danger btn-remove" title="Rimuovi"><i
                                        class="bi bi-trash"></i></button>
                                <button class="btn btn-outline-success btn-add d-none" title="Aggiungi"><i
                                        class="bi bi-plus-lg"></i></button>
                            </div>
                        </div>
                    </div>
                    <!-- /template -->
                </div>
            </main>

            <!-- Modal editor (template) -->
            <div class="modal fade" id="mealModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title"><span id="modal-title-action">Modifica</span> piatto</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                aria-label="Chiudi"></button>
                        </div>
                        <div class="modal-body">
                            <form id="meal-form" class="row g-3">
                                <input type="hidden" id="meal-id">
                                <div class="col-md-6">
                                    <label class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="meal-name" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Categoria</label>
                                    <input type="text" class="form-control" id="meal-category">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Prezzo (€)</label>
                                    <input type="number" class="form-control" id="meal-price" step="0.01" min="0"
                                        required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">URL immagine</label>
                                    <input type="url" class="form-control" id="meal-img">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Ingredienti (separati da virgola)</label>
                                    <textarea class="form-control" id="meal-ingredients" rows="3"></textarea>
                                </div>
                                <div class="col-12">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="meal-visible">
                                        <label class="form-check-label" for="meal-visible">Mostra nel menu</label>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button id="modal-save-btn" type="button" class="btn btn-primary">Salva</button>
                        </div>
                    </div>
                </div>
            </div>





            
        </div>
        <div data-include="loginCard"></div>
        <div data-include="footer"></div>
    </section>

</body>

</html>>
