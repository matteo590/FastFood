<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>Cart - FastFood</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />


    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>



    <script src="/utils/layout.js"></script>
    <script type="module" src="/utils/auth.js"></script>
    <link href="/utils/layout.css" rel="stylesheet" />

</head>

<body class="pt-5">

    <div data-include="navbar"></div>

    <!-- Header-->
    <header class="bg-success py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <h1 class="display-4 fw-bolder" id="restaurant-name">Cart</h1>
                <!--<p class="lead fw-normal text-white-50 mb-0">With this shop hompeage template</p> -->
            </div>
        </div>
    </header>
    <!-- Section-->
    <section class="py-5">
        <div class="container px-4 px-lg-5 mt-5">
            <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center" id="body">

                <div class="text-end mt-4 d-flex justify-content-center align-items-center mb-5">
                    <span class="me-3 fs-5" id="total-price">Total: €0.00</span>

                    <span id="checkout-span" tabindex="0" data-bs-toggle="tooltip" data-bs-placement="top" title="Login first">
                        <button id="checkout-btn" class="btn btn-success ">
                            Buy Now
                            <i class="bi-cart me-1"></i>

                        </button>
                    </span>
                </div>

                <table class="table table-striped align-middle text-center">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Immagine</th>
                            <th scope="col">Nome</th>
                            <th scope="col">Restaurant</th>
                            <th scope="col">Quantità</th>
                            <th scope="col">Prezzo</th>
                            <th scope="col"></th>
                        </tr>
                    </thead>
                    <tbody id="cart-table-body">
                        <!-- Righe generate da JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </section>

    <div data-include="loginCard"></div>
    <div data-include="footer"></div>

</body>

</html>
