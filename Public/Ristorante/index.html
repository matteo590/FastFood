<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>Ristorante - FastFood</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />


    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>



    <script src="/utils/layout.js"></script>
    <script type="module" src="/utils/auth.js"></script>
    <link href="/utils/layout.css" rel="stylesheet" />

</head>

<body class="pt-5">

    <div data-include="navbar"></div>

    <!-- Header-->
    <header class="bg-success py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white mb-5">
                <h1 class="display-4 fw-bolder" id="restaurant-name">Shop in style</h1>
                <!--<p class="lead fw-normal text-white-50 mb-0">With this shop hompeage template</p> -->
            </div>
            
        </div>
        <div class="container d-flex justify-content-evenly text-white ">
            <span class="fst-italic me-4">
                <i class="bi bi-telephone-fill me-1"></i>
                <span id="tel"></span>
            </span>
            <span class="fst-italic me-4">
                <i class="bi bi-geo-alt-fill me-1"></i>
                <span id="address"></span>
            </span>
            <span class="fst-italic">
                <i class="bi bi-file-earmark-text-fill me-1"></i>
                <span id="piva"></span>
            </span>
        </div>
    </header>
    <!-- Section-->
    <section class="py-5">
        <div class="container px-4 px-lg-5 mt-5">
            <div class="col-12 mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <h2 class="fw-bold mb-0">Menu</h2>
                    <div class="d-flex flex-row">
                        <select class="form-select me-2" id="sortSelect" style="width: auto; display: inline-block;">
                            <option value="">Sort by</option>
                            <option value="name-asc">Name (A-Z)</option>
                            <option value="name-desc">Name (Z-A)</option>
                            <option value="price-asc">Price (Low to High)</option>
                            <option value="price-desc">Price (High to Low)</option>
                        </select>
                        <form class="d-flex" role="search" style="max-width: 300px;">
                            <input class="form-control me-2" type="search" placeholder="Search" id="searchInput"
                                aria-label="Search">
                        </form>
                    </div>
                </div>
                <hr>
            </div>
            <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center" id="body">



                <div class="col mb-5 d-none" id="clone">
                    <div class="card h-100">
                        <!-- Product image (WRAP + OVERLAY) -->
                        <div class="img-wrap position-relative">
                            <img class="card-img-top" src="" alt="" role="button" data-bs-toggle="modal"
                                data-bs-target="#dishModal-0" />
                            <div class="img-overlay"></div>
                            <i class="bi bi-info-circle-fill info-icon"></i>
                        </div>

                        <!-- Product details-->
                        <div class="card-body p-4">
                            <div class="text-center">
                                <h5 class="fw-bolder name" id="name"></h5>
                                <hr>
                                <p class="price"></p>
                                <i class="fw-bolder category" id="category"></i>
                            </div>
                        </div>

                        <!-- Product actions-->
                        <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                            <div class="text-center"><button class="btn btn-outline-dark mt-auto add-to-cart">Add to
                                    cart</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>




            <div class="modal fade d-none" id="cloneModal">
                <div
                    class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl modal-lg-lg modal-md-md">


                    <div class="modal-content">
                        <div class="modal-header border-0">
                            <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal"
                                aria-label="Chiudi"></button>
                        </div>

                        <div class="container px-4 px-lg-5 mb-5">
                            <div class="row gx-4 gx-lg-5 align-items-center">
                                <div class="col-md-6"><img class="card-img-top mb-5 mb-md-0"
                                        src="https://dummyimage.com/600x700/dee2e6/6c757d.jpg" alt="..." /></div>
                                <div class="col-md-6">
                                    <div class="small mb-1 category"></div>
                                    <h1 class="display-5 fw-bolder name">Title</h1>
                                    <div class="fs-5 mb-5">
                                        <span class="price">Price</span>
                                    </div>
                                    <p class="lead description mb-5">Description</p>
                                    <div class="d-flex">
                                        <input class="form-control text-center me-3" id="inputQuantity" type="num"
                                            value="1" style="max-width: 3rem" />
                                        <div class="text-center"><button
                                                class="btn btn-outline-dark mt-auto add-to-cart">Add to
                                                cart</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>


                </div>
            </div>
    </section>
    <div data-include="loginCard"></div>
    <div data-include="footer"></div>

</body>

</html>
