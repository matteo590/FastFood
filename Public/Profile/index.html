<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>Profile - FastFood</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />


    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>



    <script src="/utils/layout.js"></script>
    <script type="module" src="/utils/auth.js"></script>
    <link href="/utils/layout.css" rel="stylesheet" />

</head>

<body class="pt-5">

    <div data-include="navbar"></div>

    <!-- Header-->
    <header class="bg-success py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <h1 class="display-4 fw-bolder" id="restaurant-name">Account Settings</h1>
                <!--<p class="lead fw-normal text-white-50 mb-0">With this shop hompeage template</p> -->
            </div>
        </div>
    </header>
    <!-- Section-->
    <section class="py-5 bg-light">
        <div class="container mt-5">
            <div class="card shadow-lg p-4">
                <h2 class="text-center mb-4">Modifica Account</h2>
                <form id="profile-form">

                    <!-- Nome -->
                    <div class="mb-3">
                        <label for="firstname" class="form-label">Name</label>
                        <input type="text" class="form-control" id="firstname" name="firstname"
                            placeholder="Inserisci il tuo nome">
                    </div>

                    <!-- Cognome -->
                    <div class="mb-3">
                        <label for="lastname" class="form-label">Surname</label>
                        <input type="text" class="form-control" id="lastname" name="lastname"
                            placeholder="Inserisci il tuo cognome">
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" autocomplete="username" name="email"
                            placeholder="esempio@mail.com">
                    </div>

                    <!-- Data di nascita -->
                    <div class="mb-3">
                        <label for="birthday" class="form-label">Birthdate</label>
                        <input type="date" class="form-control" id="birthday" name="birthday">
                    </div>

                    <!-- Password -->
                    <div class="row">
                        <div class="mb-3 col">
                            <label for="current-password" class="form-label">Current Password</label>
                            <input type="password" class="form-control" autocomplete="current-password" id="current_psw"
                                name="current_psw" placeholder="Enter current password">
                        </div>
                        <div class="mb-3 col">
                            <label for="new-password" class="form-label">New Password</label>
                            <input type="password" class="form-control" autocomplete="new-password" id="pass"
                                name="pass" placeholder="Leave empty to keep current password">
                        </div>
                    </div>

                    <!-- Metodo di pagamento -->
                    <div class="mb-3">
                        <label for="payment" class="form-label">Payment Method</label>
                        <select class="form-select" id="paymentMethod" name="paymentMethod">
                            <option value="">-- Select a method --</option>
                            <option value="carta">Card</option>
                            <option value="paypal">PayPal</option>
                            <option value="bancomat">Bancomat</option>
                        </select>
                    </div>
                    <div class="alert alert-danger d-flex align-items-center d-none" id="alert-block" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span id="alert-msg"></span>
                    </div>
                    <!-- Bottone -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Salva modifiche</button>
                    </div>
                </form>
            </div>
        </div>

    </section>
    <section class="k">
        <div class="container d-flex flex-row justify-content-between p-5">
            <span id="deleteAccountSpan" tabindex="0" data-bs-toggle="tooltip" data-bs-placement="top" title="Delete restaurant first">
                <button class="btn btn-danger ms-3" id="delete-account-btn">Elimina account</button>
            </span>
            <button class="btn btn-secondary" role="button" onclick="location.href='/restSettings'" id="createRestaurantBtn">Vuoi far partire un
                business? crea un ristorante</button>

        </div>
    </section>

    <div data-include="loginCard"></div>
    <div data-include="footer"></div>

</body>

</html>
